version: 2

models:

  - name: dim_customers
    description: 
      Dimensão de clientes utilizada para análise
      comercial e relacionamento.

    columns:
      - name: customer_id
        description: "Chave única do cliente."

        tests:
          - unique
          - not_null

  - name: dim_products
    description: 
      Dimensão de produtos enriquecida
      com categorias e fornecedores.

    columns:
      - name: product_id

        tests:
          - unique
          - not_null

      - name: category_id

        tests:
          - relationships:
              to: ref('stg_categories')
              field: category_id

      - name: supplier_id

        tests:
          - relationships:
              to: ref('stg_suppliers')
              field: supplier_id
      
  - name: dim_categories
    description: 
      Dimensão de categorias de produtos.
      Contém informações descritivas utilizadas para agrupar e analisar
      produtos por categoria. 

    columns:
      - name: category_id

        tests:
          - unique
          - not_null

  - name: dim_employees
    description: 
      Dimensão de funcionários responsáveis pelo processamento dos pedidos.
      Contém informações cadastrais dos colaboradores utilizadas para análises
      de desempenho comercial e distribuição de vendas.

    columns:
      - name: employee_id

        tests:
          - unique
          - not_null